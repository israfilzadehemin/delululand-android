name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DL_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: gradle/actions/wrapper-validation@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # C3: the upload key comes from repository secrets once they exist; until then release builds
      # are signed with the debug key (the summary says which).
      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.DL_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DL_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            {
              echo "DL_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks"
              echo "DL_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "DL_KEY_ALIAS=$KEY_ALIAS"
              echo "DL_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Release builds: signed with the upload key." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Release builds: signed with the DEBUG key (no DL_KEYSTORE_BASE64 secret yet)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Code style
        run: ./gradlew ktlintCheck

      - name: Unit and screenshot tests
        run: ./gradlew testProdDebugUnitTest :core:designsystem:testDebugUnitTest -Proborazzi.test.record=true

      - name: Lint
        run: ./gradlew :app:lintProdDebug

      - name: Build APKs and bundle
        run: ./gradlew assembleTestDebug assembleProdDebug assembleTestRelease assembleProdRelease bundleProdRelease

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: '**/build/outputs/roborazzi/*.png'
          if-no-files-found: warn

      - name: Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

      - name: APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
